name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Pass files explicitly: Node 22+ treats a bare directory argument as a glob pattern.
      - run: node --test dist/test/*.test.js
      - name: Validate and test the example rule sets with the CLI
        run: |
          node dist/src/bin.js validate examples/redirects.csv
          node dist/src/bin.js validate examples/short-links.csv
          node dist/src/bin.js validate examples/redirects.json --allow-regex
          node dist/src/bin.js test examples/redirects.csv --cases examples/cases.json

  bundle:
    name: Wrangler bundle (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy --dry-run --outdir dist-worker
        env:
          WRANGLER_SEND_METRICS: "false"
